<!-- Booking Popup -->
<div class="booking-overlay" id="bookingOverlay">
  <div class="booking-popup">
	<button class="close-popup" onclick="closeBookingPopup()">
	  <i class="fas fa-times"></i>
	</button>
	<form
	  class="booking-form"
	  onsubmit="handleBookingSubmit(event)"
	  autocomplete="off"
	>
	  <h3>Réservez ton aventure</h3>

	  <div class="form-group">
		<label for="package">Choisez une offre</label>
		<select name="package" id="package" required>
		  <option value="">Choisis une offre</option>
		  <option value="nkonkoni-base-camp">
			Camp de Base de Randonnée à Konkoni - 2000 KMF
		  </option>
		  <option value="itsanga-shema-circuit">
			Circuit d'Aventures d'Itsanga Shema - 1500 KMF
		  </option>
		  <option value="ngutsini-boat-tour">
			Tour en bateau au Ngutsini - 3000 KMF
		  </option>
		  <option value="Djongoni-randonnée">
			La Randonné au Djongoni - 1800 KMF
		  </option>
		</select>
	  </div>

	  <div class="form-row">
		<div class="form-group">
		  <label for="firstName">Prénom</label>
		  <input type="text" id="firstName" name="firstName" required />
		</div>

		<div class="form-group">
		  <label for="lastName">Nom</label>
		  <input type="text" id="lastName" name="lastName" required />
		</div>
	  </div>

	  <div class="form-group">
		<label for="email">Email</label>
		<input type="email" id="email" name="email" required />
	  </div>

	  <div class="form-row">
		<div class="form-group">
		  <label for="phone">Numéro de téléphone</label>
		  <input type="tel" id="phone" name="phone" required />
		</div>

		<div class="form-group">
		  <label for="country">Pays</label>
		  <input type="text" id="country" name="country" required />
		</div>
	  </div>

	  <div class="form-row">
		<div class="form-group">
		  <label for="travelDate">Dates de voyage</label>
		  <input type="date" id="travelDate" name="travelDate" required />
		</div>

		<div class="form-group">
		  <label for="groupeSize">Nombre de voyageurs</label>
		  <select name="groupeSize" id="groupeSize" required>
			<option value="">Choisez le nombre de voyageurs</option>
			<option value="1">Solo (1 personne)</option>
			<option value="2">Couple (2 personnes)</option>
			<option value="3-5">Petit group (3-5 personnes)</option>
			<option value="6+">Large groupe (6+ personnes)</option>
		  </select>
		</div>
	  </div>

	  <div class="form-group">
		<label for="experience">Experience en randonnée</label>
		<select name="experience" id="experience" required>
		  <option value="">Choisez le niveau d'experience</option>
		  <option value="Biginner">Débutant</option>
		  <option value="intermediate">Intermediaire</option>
		  <option value="advenced">Avancé</option>
		  <option value="Expert">Expert</option>
		</select>
	  </div>

	  <div class="form-group">
		<label for="specialRequests">Demandes spéciales</label>
		<textarea
		  name="specialRequests"
		  id="specialRequests"
		  rows="3"
		  placeholder="Please mention your special request if you have any."
		></textarea>
	  </div>

	  <button type="submit" class="submit-btn">
		<i class="fas fa-paper-plane"></i> Envoyez votre demande
	  </button>
	</form>
  </div>
</div>
